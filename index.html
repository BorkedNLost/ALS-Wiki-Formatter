<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALS Unit Template</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>ALS Unit Template</h1><p>Build a paste-ready InfoUnitData unit block.</p></header><main><section class="card"><h2>Unit information</h2><div class="grid">
<label>Unit name<input id="name" placeholder="Berserker"></label><label>Rarity<select id="rarity"><option>Rare</option><option>Epic</option><option>Legendary</option><option selected>Mythic</option><option>Celestial</option><option>Secret</option><option>Exotic</option></select></label>
<label>Element<input id="element" placeholder="Dark"></label><label>Subtype<select id="subtype"><option>Physical</option><option>Magical</option></select></label><label>Tower type<select id="tower"><option>Ground</option><option>Hill</option><option>Hybrid</option></select></label><label>Max placement<input id="placement" type="number" min="1" value="4"></label><label>Image name<input id="image" placeholder="Berserker-FB"></label><label>Quote<input id="caption"></label><label class="wide">Overview<textarea id="overview"></textarea></label></div>
<h2>Upgrades</h2><div id="upgrades"></div><button id="add" type="button">+ Add upgrade</button></section>
<section class="card output"><div class="bar"><h2>Lua output</h2><button id="example" type="button">Example</button><button id="copy" type="button">Copy Lua</button><button id="download" type="button">Download .lua</button></div><div id="warnings"></div><pre id="output"></pre></section></main><template id="upgrade"><article class="upgrade"><div class="bar"><strong>Upgrade <span class="num"></span></strong><button class="remove" type="button">Remove</button></div><div class="grid"><label>Cost<input data-k="cost" type="number" min="0"></label><label>Damage<input data-k="damage" type="number" min="0" step="any"></label><label>Range<input data-k="range" type="number" min="0" step="any"></label><label>SPA<input data-k="spa" type="number" min="0" step="any"></label><label>Attack type<input data-k="attack" placeholder="AoE (Cone)"></label><label>Ability / change text<input data-k="text"></label></div><fieldset><legend>Status effects</legend><label><input type="checkbox" data-effect="burn"> Burn</label><label><input type="checkbox" data-effect="bleed"> Bleed</label><label><input type="checkbox" data-effect="freeze"> Freeze</label><label><input type="checkbox" data-effect="slow"> Slow</label><label><input type="checkbox" data-effect="crippled"> Crippled</label><label><input type="checkbox" data-effect="hex"> Hex</label></fieldset></article></template><script src="script.js"></script></body></html>
